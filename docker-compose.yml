x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /app/data/uploads
    RESULTS_ROOT: /app/data/evaluations
    STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    STREAMLIT_THEME_BASE: ${STREAMLIT_THEME_BASE:-light}
    STREAMLIT_THEME_PRIMARY_COLOR: ${STREAMLIT_THEME_PRIMARY_COLOR:-#2563eb}
    STREAMLIT_THEME_BACKGROUND_COLOR: ${STREAMLIT_THEME_BACKGROUND_COLOR:-#ffffff}
    STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR: ${STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR:-#f1f5f9}
    STREAMLIT_THEME_TEXT_COLOR: ${STREAMLIT_THEME_TEXT_COLOR:-#0f172a}
    GIT_PYTHON_REFRESH: 'quiet'
  volumes:
    - app_data:/app/data
  restart: unless-stopped
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT}:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:?set REDIS_PORT}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [python, -m, src.migrate]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - '127.0.0.1:${APP_PORT:?set APP_PORT}:8501'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *app
    command: [celery, -A, worker.tasks:celery_app, worker, --loglevel=WARNING, --concurrency=1, -Q, 'ingestion,evaluation']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  scheduler:
    <<: *app
    command: [celery, -A, worker.tasks:celery_app, beat, --loglevel=WARNING, --schedule=/app/data/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_data:

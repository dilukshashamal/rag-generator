[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires TEST_DATABASE_URL and TEST_REDIS_URL"]
addopts = ["--basetemp=./data/pytest_tmp", "-o", "cache_dir=./data/pytest_cache"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
